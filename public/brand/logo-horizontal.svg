<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 512" width="1800" height="512">
  <!-- graph2agent horizontal lockup: mark + wordmark -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a212c"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="110" y1="256" x2="440" y2="256">
      <stop offset="0" stop-color="#60D0F4"/>
      <stop offset="1" stop-color="#8CF174"/>
    </linearGradient>
    <radialGradient id="agentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8CF174" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8CF174" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mark -->
  <g>
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
    <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#2c3442" stroke-width="3"/>
    <g fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round">
      <path d="M186 140 C 234 140, 228 226, 276 226"/>
      <path d="M188 262 L 276 262"/>
      <path d="M186 384 C 234 384, 228 298, 276 298"/>
    </g>
    <g fill="none" stroke-width="14">
      <circle cx="140" cy="140" r="36" stroke="#60D0F4"/>
      <path d="M140 216 L186 262 L140 308 L94 262 Z" stroke="#74DFB4" stroke-linejoin="round"/>
      <rect x="104" y="348" width="72" height="72" rx="16" stroke="#8CF174"/>
    </g>
    <circle cx="360" cy="262" r="140" fill="url(#agentGlow)"/>
    <rect x="276" y="180" width="168" height="164" rx="40"
          fill="none" stroke="url(#flow)" stroke-width="15"/>
    <path d="M316 226 L352 262 L316 298" fill="none" stroke="#60D0F4"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 298 L414 298" stroke="#8CF174" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="572" y="322" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="176" font-weight="600" letter-spacing="-2">
    <tspan fill="#60D0F4">graph</tspan><tspan fill="#74DFB4">2</tspan><tspan fill="#8CF174">agent</tspan>
  </text>
</svg>
